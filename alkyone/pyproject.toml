[project]
name = "pleiades-alkyone"
version = "0.1.0"
description = "Integration Test Suite for Project Pleiades"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12, <3.13"
authors = [
    {name = "Ahmad Saeed Zaidi"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "pleiades-tiered-storage>=0.1.0,<0.2.0",
    "pleiades-atlas[hf]",
    "pleiades-maia"
]

[tool.poetry]
name = "pleiades-alkyone"
version = "0.1.0"
description = "Integration Test Suite for Project Pleiades"
authors = ["Ahmad Saeed Zaidi"]
readme = "README.md"
license = "MIT"
packages = [{include = "alkyone", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12, <3.13"
pleiades-tiered-storage = {path = "../tiered_storage", develop = true}
pleiades-atlas = {path = "../atlas", develop = true, extras = ["hf"]}
pleiades-maia = {path = "../maia", develop = true}

[tool.poetry.group.dev.dependencies]
ruff = ">=0.15.0,<1.0.0"
mypy = ">=2.0.0,<3.0.0"
pytest = ">=8.0.0,<9.0.0"
pytest-asyncio = ">=0.23.0,<1.0.0"
pytest-env = ">=1.1.0,<2.0.0"
pytest-timeout = ">=2.2.0,<3.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = false
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "google.cloud.*",
    "pandas.*",
    "huggingface_hub.*",
    "atlas.*",
    "maia.*",
    "pytest.*",
    "pytest_asyncio.*",
    "pydantic.*",
    "pydantic_settings.*",
    "aiohttp.*",
    "psycopg.*",
    "psycopg_pool.*",
    "orjson.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
    "--disable-warnings",
]
filterwarnings = [
    "ignore::DeprecationWarning:prefect.*",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
]
env = [
    # NOTE: YOUTUBE_API_KEY_POOL_JSON should come from .env for integration tests
    # Unit tests mock the KeyRing, so they don't need real keys
    "COMPLIANCE_MODE=false",
    "VAULT_PROVIDER=huggingface",
    "ENV=dev",
    "JANITOR_ENABLED=false",
    "JANITOR_RETENTION_DAYS=7",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "timeout: per-test timeout in seconds (handled by pytest-timeout)",
    "production_e2e: E2E that may target the production HuggingFace vault; set PLEIADES_USE_PRODUCTION_VAULT=1 to run (see alkyone/fixtures.py)",
    "live: marks tests that connect to live external services (explicit opt-in only)",
    "smoke: marks live service connectivity checks (explicit opt-in only)",
]
