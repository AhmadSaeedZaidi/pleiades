[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pleiades-tiered-storage"
version = "0.1.0"
description = "Verified, version-aware hot-to-cold storage handoffs"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE.md"}
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tiered_storage = ["py.typed"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
