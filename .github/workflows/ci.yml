name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, unit tests and PostgreSQL regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pleiades_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '**/pyproject.toml'
      - name: Install from committed component locks
        run: |
          python -m pip install 'poetry==2.0.0'
          poetry config virtualenvs.create false
          make install
      - name: Canonical repository gate
        run: make check
      - name: Isolated database regressions (no external credentials)
        env:
          ALKYONE_ALLOW_INTEGRATION: '1'
          DATABASE_URL: postgresql://test:test@127.0.0.1:55432/pleiades_test
          ALKYONE_TEST_DATABASE_URL: postgresql://test:test@127.0.0.1:55432/pleiades_test
          HF_DATASET_ID: local/ci-vault
          ALKYONE_TEST_VAULT: local/ci-vault
          HF_TOKEN: mock
          VAULT_PROVIDER: huggingface
          YOUTUBE_API_KEY_POOL_JSON: '["mock-ci-key"]'
          PLEIADES_PROD_DATABASE_URL: postgresql://production.invalid/production
          PLEIADES_PROD_VAULT: production/never-contacted
          PLEIADES_PROD_YOUTUBE_KEY_POOL_JSON: '["production-never-used"]'
          ENV: test
        run: python -m pytest alkyone/tests/storage -q -o env=

  production-image:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
