name: Deploy (executor VPS)

# Deploys the Pleiades codebase to the executor VPS, where the
# pleiades-ingestion systemd service runs the plain agent operations from
# disk (see docs/micro-prefect-orchestration.md).
# Prefect deployments remain rollback adapters; this workflow does not create a
# second cadence source.
#
# Runs after successful CI on main, checks out that exact SHA, and refuses
# dirty deployment checkouts. Manual dispatch is an explicit operator action.
# Secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH,
# optional INGESTION_SERVICE (default pleiades-ingestion).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print commands, no changes)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: deploy-executor
  cancel-in-progress: false

env:
  DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
  INGESTION_SERVICE: ${{ secrets.INGESTION_SERVICE }}
  # The CI-verified commit. Empty for workflow_dispatch (no upstream CI run),
  # in which case the deploy script falls back to origin/main.
  DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  smoke:
    name: Preflight (CI status + code smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Gate on the CI workflow's own conclusion for the commit being deployed.
      # A workflow run concludes `failure` if ANY job failed, which is what
      # closes the hole where a failed ci-env image build caused `quality` and
      # `unit-tests` to be skipped while the deploy sailed through.
      - name: Require CI to have passed on this commit
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CI_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$CI_CONCLUSION" != "success" ]; then
            echo "CI conclusion for $CI_HEAD_SHA is '$CI_CONCLUSION'; refusing to deploy." >&2
            exit 1
          fi
          if [ "$CI_HEAD_BRANCH" != "main" ]; then
            echo "CI ran on '$CI_HEAD_BRANCH', not main; refusing to deploy." >&2
            exit 1
          fi
          if [ "$CI_HEAD_SHA" != "$TARGET_SHA" ]; then
            # workflow_run checks out the default branch tip; a newer commit
            # landed on main while we waited. Deploy that newer commit's own
            # CI-verified tree rather than the tip we happened to check out.
            echo "note: CI verified $CI_HEAD_SHA; deploying that exact commit." >&2
          fi
          echo "CI passed for $CI_HEAD_SHA."

      # Lightweight local smoke before deploy: compile our Python sources.
      - name: Code syntax smoke
        run: python3 -m compileall -q atlas maia alkyone mcp dashboard tools

  deploy:
    name: SSH deploy + restart pleiades-ingestion
    runs-on: ubuntu-latest
    needs: smoke
    if: github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Deploy the exact commit CI verified. `git pull --ff-only` would race
          # a newer main landing mid-deploy and put untested code in production.
          # workflow_dispatch has no CI run, so it falls back to origin/main.
          envs: DEPLOY_SHA
          script: |
            set -euo pipefail
            CDIR="${{ env.DEPLOY_PATH }}"
            SVCP="${{ env.INGESTION_SERVICE }}"
            SVCP="${SVCP:-pleiades-ingestion}"
            DRY="${{ github.event.inputs.dry_run }}"

            if [ -z "$CDIR" ]; then
              echo "DEPLOY_PATH secret is not set; aborting." >&2
              exit 1
            fi

            TARGET="${DEPLOY_SHA:-origin/main}"

            if [ "${DRY:-false}" = "true" ]; then
              echo "[dry-run] would fetch and check out $TARGET, install, run make check, and restart $SVCP"
              exit 0
            fi

            cd "$CDIR"
            if [ -n "$(git status --porcelain)" ]; then
              echo "Deploy checkout contains local changes; refusing to overwrite them." >&2
              exit 1
            fi
            git fetch origin --tags
            git checkout --detach "$TARGET"
            echo "deployed commit: $(git rev-parse HEAD)"
            make install
            # The plain scheduler does not depend on Prefect deployments.
            make check
            sudo systemctl restart "$SVCP"
            echo "deploy complete: $SVCP restarted from $CDIR at $(git rev-parse HEAD)"
