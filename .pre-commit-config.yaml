---
# Stage: commit — fast local formatting & linting
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff
        name: ruff check (atlas)
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
        files: ^atlas/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff
        name: ruff check (maia)
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
        files: ^maia/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff
        name: ruff check (alkyone)
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
        files: ^alkyone/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff
        name: ruff check (mcp)
        args: [--fix, --exit-non-zero-on-fix, --config, pyproject.toml]
        files: ^mcp/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (atlas)
        args: [--config, pyproject.toml]
        files: ^atlas/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (maia)
        args: [--config, pyproject.toml]
        files: ^maia/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (alkyone)
        args: [--config, pyproject.toml]
        files: ^alkyone/
        types_or: [python, pyi]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format (mcp)
        args: [--config, pyproject.toml]
        files: ^mcp/
        types_or: [python, pyi]
        stages: [pre-commit]

# Stage: pre-push — heavier gates (mypy, tests, full lint)
  - repo: local
    hooks:
      - id: tiered-storage-lint
        name: tiered storage lint
        entry: make -C tiered_storage lint
        language: system
        pass_filenames: false
        files: ^tiered_storage/
        stages: [pre-commit]
      - id: dashboard-lint
        name: dashboard lint
        entry: make -C dashboard lint
        language: system
        pass_filenames: false
        files: ^dashboard/
        stages: [pre-commit]
      - id: unit-tests
        name: unit tests (all components)
        entry: make test-unit
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true

      - id: lint-check
        name: lint check (readonly — no fix)
        entry: make lint
        language: system
        pass_filenames: false
        stages: [pre-push]
        always_run: true
