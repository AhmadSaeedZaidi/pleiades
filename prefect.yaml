name: pleiades

prefect-version: 3.7.8

deployments:
  # Rollback/telemetry adapters only. Live cadence is owned by the
  # pleiades-ingestion systemd service and maia.orchestrator; schedules are
  # intentionally omitted so this file cannot create a second scheduler.
  - name: streamer
    entrypoint: maia/src/maia/streamer/flow.py:streamer_flow
    work_pool:
      name: default
      work_queue_name: streamer
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 5
    job_variables:
      env:
        PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
        VAULT_PROVIDER: huggingface
        COMPLIANCE_MODE: "false"
        HOME: /home/ubuntu
        YOUTUBE_COOKIES_PATH: /home/ubuntu/code/pleiades/www.youtube.cookies.txt
        YOUTUBE_PROXY: socks5h://127.0.0.1:1090

  - name: singer
    entrypoint: maia/src/maia/singer/flow.py:singer_flow
    work_pool:
      name: default
      work_queue_name: singer
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 10
    job_variables:
      env:
        PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
        VAULT_PROVIDER: huggingface
        COMPLIANCE_MODE: "false"
        HOME: /home/ubuntu
        YOUTUBE_COOKIES_PATH: /home/ubuntu/code/pleiades/www.youtube.cookies.txt
        YOUTUBE_PROXY: socks5h://127.0.0.1:1090

  - name: painter
    entrypoint: maia/src/maia/painter/flow.py:painter_flow
    work_pool:
      name: default
      work_queue_name: painter
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 5
    job_variables:
      env:
        PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
        VAULT_PROVIDER: huggingface
        COMPLIANCE_MODE: "false"
        HOME: /home/ubuntu
        YOUTUBE_COOKIES_PATH: /home/ubuntu/code/pleiades/www.youtube.cookies.txt
        YOUTUBE_PROXY: socks5h://127.0.0.1:1090

  - name: scribe
    entrypoint: maia/src/maia/scribe/flow.py:scribe_flow
    work_pool:
      name: default
      work_queue_name: scribe
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 10
    job_variables:
      env:
        PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
        VAULT_PROVIDER: huggingface
        COMPLIANCE_MODE: "false"
        HOME: /home/ubuntu
        YOUTUBE_COOKIES_PATH: /home/ubuntu/code/pleiades/www.youtube.cookies.txt
        YOUTUBE_PROXY: "socks5h://127.0.0.1:1090,direct"

  - name: hunter
    entrypoint: maia/src/maia/hunter/flow.py:run_hunter_cycle
    work_pool:
      name: default
      work_queue_name: hunter
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 10
    env:
      PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
      VAULT_PROVIDER: huggingface
      COMPLIANCE_MODE: "false"
      HOME: /home/ubuntu

  - name: tracker
    entrypoint: maia/src/maia/tracker/flow.py:run_tracker_cycle
    work_pool:
      name: default
      work_queue_name: tracker
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      batch_size: 50
    env:
      PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
      VAULT_PROVIDER: huggingface
      COMPLIANCE_MODE: "false"
      HOME: /home/ubuntu

  - name: archeologist
    entrypoint: maia/src/maia/archeologist/flow.py:run_archeology_campaign
    work_pool:
      name: default
      work_queue_name: archeologist
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      start_year: 2010
      end_year: 2024
    env:
      PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
      VAULT_PROVIDER: huggingface
      COMPLIANCE_MODE: "false"
      HOME: /home/ubuntu

  - name: heartbeat
    entrypoint: maia/src/maia/heartbeat/flow.py:heartbeat_flow
    work_pool:
      name: default
      work_queue_name: heartbeat
    working_dir: /home/ubuntu/code/pleiades
    env:
      PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
      VAULT_PROVIDER: huggingface
      COMPLIANCE_MODE: "false"
      HOME: /home/ubuntu

  - name: janitor
    entrypoint: maia/src/maia/janitor/flow.py:janitor_flow
    work_pool:
      name: default
      work_queue_name: janitor
    working_dir: /home/ubuntu/code/pleiades
    parameters:
      dry_run: false
    env:
      PYTHONPATH: /home/ubuntu/code/pleiades/atlas/src:maia/src
      VAULT_PROVIDER: huggingface
      COMPLIANCE_MODE: "false"
      HOME: /home/ubuntu
