# Include inside the existing port-80 server block.
# Only the ACME solver is forwarded over the Docker bridge.
location /.well-known/acme-challenge/ {
    proxy_pass http://172.17.0.1:8090;
    proxy_set_header Host $host;
}
location = /pleiades {
    return 302 https://opencodeserver.duckdns.org:8443/pleiades/;
}
location /pleiades/ {
    return 302 https://opencodeserver.duckdns.org:8443$request_uri;
}
