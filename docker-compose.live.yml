# Cutover override — run the Maia fleet in containers against the EXISTING
# local Postgres (the live `pleiades` DB on the host) instead of the bundled
# empty `db` service.
#
#   docker compose -f docker-compose.yml -f docker-compose.live.yml up -d <agent>
#
# Requires in .env: LIVE_DB_PASSWORD (the live Postgres password).
# The bundled `db` is disabled (profile) so it won't clash with host :5432.
# The host is reachable from containers via host.docker.internal (extra_hosts).
#
# Service definitions here only override depends_on / extra_hosts /
# DATABASE_URL; build, command and the rest are inherited from
# docker-compose.yml via the normal multi-file merge.

services:
  db:
    profiles: ["disabled"]

  hunter:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  tracker:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  janitor:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  archeologist:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  scribe:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  painter:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  streamer:
    depends_on: []
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades

  singer:
    depends_on:
      - streamer
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DATABASE_URL: postgresql://pleiades:${LIVE_DB_PASSWORD}@host.docker.internal:5432/pleiades
